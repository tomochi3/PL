<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="パワーリフティング大会の都道府県協会を選択するページです。">
  <title>都道府県を選ぶ｜日本のパワーリフティング団体地図</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="prefecture-page">
  <header class="site-header">
    <div class="page-shell header-inner">
      <a class="brand" href="index.html#top">
        <span class="brand-mark" aria-hidden="true">PL</span>
        日本のパワーリフティング団体地図
      </a>
      <nav class="header-nav" aria-label="ページナビゲーション">
        <a href="index.html#events">大会レベルへ戻る</a>
      </nav>
    </div>
  </header>

  <main class="page-shell prefecture-main">
    <section aria-labelledby="prefecture-title">
      <div class="prefecture-heading">
        <span class="section-number">AREA SELECTOR</span>
        <h1 id="prefecture-title">都道府県を選ぶ</h1>
        <p id="prefecture-description">最新の大会情報を確認する都道府県協会を選択してください。</p>
      </div>

      <div class="prefecture-toolbar">
        <div class="prefecture-search">
          <label for="prefecture-search">都道府県名</label>
          <input id="prefecture-search" type="search" placeholder="例：東京、北海道" autocomplete="off">
        </div>
        <div>
          <span class="region-label">地域</span>
          <div class="region-picker" role="group" aria-label="地域で絞り込む">
            <button class="region-button" type="button" data-region="all" aria-pressed="true">すべて</button>
            <button class="region-button" type="button" data-region="北海道・東北" aria-pressed="false">北海道・東北</button>
            <button class="region-button" type="button" data-region="関東" aria-pressed="false">関東</button>
            <button class="region-button" type="button" data-region="北信越" aria-pressed="false">北信越</button>
            <button class="region-button" type="button" data-region="東海" aria-pressed="false">東海</button>
            <button class="region-button" type="button" data-region="近畿" aria-pressed="false">近畿</button>
            <button class="region-button" type="button" data-region="中国" aria-pressed="false">中国</button>
            <button class="region-button" type="button" data-region="四国" aria-pressed="false">四国</button>
            <button class="region-button" type="button" data-region="九州・沖縄" aria-pressed="false">九州・沖縄</button>
          </div>
        </div>
      </div>

      <div class="record-toolbar" aria-label="都道府県記録の表示条件">
        <div class="record-control">
          <span class="record-control-label">性別</span>
          <div class="record-sex-picker" role="group" aria-label="性別を選ぶ">
            <button type="button" data-sex="men" aria-pressed="true">男子</button>
            <button type="button" data-sex="women" aria-pressed="false">女子</button>
          </div>
        </div>
        <label class="record-class-control" for="record-weight-class">
          <span>階級</span>
          <select id="record-weight-class"></select>
        </label>
        <div class="record-current">
          <span>表示中</span>
          <strong id="record-current-label">一般クラシック 男子66kg級</strong>
        </div>
      </div>

      <div class="prefecture-results-heading">
        <h2>日本地図から選ぶ</h2>
        <div class="map-result-meta">
          <span class="record-unit">数字：kg ／ –：未公開 ／ 太枠：地区大会</span>
          <span class="prefecture-count" id="prefecture-count" aria-live="polite"></span>
        </div>
      </div>
      <div class="japan-map-frame">
        <nav class="japan-map" id="prefecture-map" aria-label="都道府県協会の日本地図"></nav>
        <div class="map-prefecture-name" id="map-prefecture-name" aria-live="polite"></div>
      </div>
      <p class="prefecture-empty" id="prefecture-empty" aria-live="polite" hidden>該当する都道府県がありません。</p>
      <p class="prefecture-note">※ 公式サイトがJPAに掲載されていない県は、JPAの加盟都道府県協会一覧へ移動します。</p>
      <p class="record-coverage" id="record-coverage"></p>
      <p class="district-coverage" id="district-coverage"></p>
      <p class="map-credit">地図データ: <a href="https://mapsvg.com/maps/japan" target="_blank" rel="noreferrer">MapSVG</a> / <a href="https://www.npmjs.com/package/@svg-maps/japan" target="_blank" rel="noreferrer">@svg-maps/japan</a>（<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>、リンク機能を追加）</p>
    </section>
  </main>

  <script src="japan-map-data.js" defer></script>
  <script src="prefecture-records.js" defer></script>
  <script src="prefectures.js" defer></script>
</body>
</html>
